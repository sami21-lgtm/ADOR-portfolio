<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADOR Designs — Graphic Designer & Visual Storyteller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'inter': ['Inter', 'sans-serif'] },
                    colors: { neon: '#00ff88', dark: { 900: '#0a0a0a', 800: '#111', 700: '#1a1a1a' } }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#efe7da] text-neutral-900 grid-bg overflow-x-hidden">
    <div class="cursor-dot hidden lg:block" id="cursorDot"></div>
    <div class="cursor-ring hidden lg:block" id="cursorRing"></div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">✕</button>
        <button class="lightbox-nav lightbox-prev" id="lbPrev">‹</button>
        <button class="lightbox-nav lightbox-next" id="lbNext">›</button>
        <img id="lightboxImg" src="" alt="">
        <div class="lightbox-info">
            <div class="lightbox-cat" id="lightboxCat"></div>
            <div class="lightbox-title" id="lightboxTitle"></div>
        </div>
    </div>

    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 transition-all duration-500">
        <div class="max-w-7xl mx-auto px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="#home" class="flex items-center gap-2 group">
                    <div class="w-10 h-10 rounded-xl bg-[#00ff88] flex items-center justify-center text-black font-black text-lg group-hover:shadow-lg group-hover:shadow-[#00ff88]/25 transition-all duration-300">R</div>
                    <span class="text-xl font-bold tracking-tight">RADOR<span class="text-[#00ff88]">.</span></span>
                </a>
                <div class="hidden md:flex items-center gap-10">
                    <a href="#home" class="nav-link text-sm font-medium text-neutral-700 hover:text-[#00ff88] transition-colors active">HOME</a>
                    <a href="#about" class="nav-link text-sm font-medium text-neutral-700 hover:text-[#00ff88] transition-colors">ABOUT</a>
                    <a href="#projects" class="nav-link text-sm font-medium text-neutral-700 hover:text-[#00ff88] transition-colors">PROJECTS</a>
                    <a href="#contact" class="nav-link text-sm font-medium text-neutral-700 hover:text-[#00ff88] transition-colors">CONTACT</a>
                </div>
                <button id="mobileBtn" class="md:hidden w-10 h-10 flex flex-col items-center justify-center gap-1.5 z-50">
                    <span class="w-6 h-0.5 bg-neutral-900 transition-all duration-300" id="l1"></span>
                    <span class="w-6 h-0.5 bg-neutral-900 transition-all duration-300" id="l2"></span>
                    <span class="w-4 h-0.5 bg-neutral-900 transition-all duration-300 ml-auto" id="l3"></span>
                </button>
            </div>
        </div>
    </nav>

    <section id="home" class="relative min-h-screen flex items-center overflow-hidden">
        <div class="max-w-7xl mx-auto px-6 lg:px-8 w-full pt-28 pb-20 relative z-10">
            <div class="grid lg:grid-cols-2 gap-12 lg:gap-20 items-center">
                <div>
                    <h1 class="reveal text-5xl sm:text-6xl lg:text-7xl xl:text-8xl font-black leading-[.95] tracking-tight mb-4">It's<br><span class="text-gradient glow-green">RADOR</span></h1>
                    <p class="reveal text-xl sm:text-2xl font-light text-neutral-600 mb-4">Graphic Designer &<br><span class="text-neutral-900 font-medium">Visual Storyteller</span></p>
                    <div class="reveal flex flex-wrap gap-4 mt-8">
                        <a href="#projects" class="group inline-flex items-center gap-3 px-8 py-4 bg-[#00ff88] text-black font-bold rounded-full hover:bg-[#00cc6a] transition-all">VIEW PROJECTS</a>
                    </div>
                </div>

                <div class="reveal-right relative">
                    <div class="relative rounded-3xl overflow-hidden border border-neutral-300 bg-white/50 p-3">
                        <div class="grid grid-cols-2 gap-2.5">
                            <div class="relative rounded-2xl overflow-hidden aspect-[3/4] group cursor-pointer" onclick="openLightboxByIndex(0)">
                                <img src="f1_poster.jpg" alt="F1 Poster" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/80 flex items-end p-2"><span class="text-[10px] font-bold text-[#00ff88]">F1 CLASSIC</span></div>
                            </div>
                            <div class="relative rounded-2xl overflow-hidden aspect-[3/4] group cursor-pointer" onclick="openLightboxByIndex(1)">
                                <img src="gt3_r_poster.jpg" alt="GT3 R Poster" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/80 flex items-end p-2"><span class="text-[10px] font-bold text-[#00ff88]">GT3 R</span></div>
                            </div>
                            <div class="relative rounded-2xl overflow-hidden aspect-[3/4] group cursor-pointer" onclick="openLightboxByIndex(2)">
                                <img src="hamza_classic.jpg" alt="Hamza Classic" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/80 flex items-end p-2"><span class="text-[10px] font-bold text-[#00ff88]">HAMZA CLASSIC</span></div>
                            </div>
                            <div class="relative rounded-2xl overflow-hidden aspect-[3/4] group cursor-pointer" onclick="openLightboxByIndex(3)">
                                <img src="Match Result.jpg" alt="Match Result" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700">
                                <div class="absolute inset-0 bg-gradient-to-t from-black/80 flex items-end p-2"><span class="text-[10px] font-bold text-[#00ff88]">LATEST</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
